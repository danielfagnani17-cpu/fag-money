<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B16">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fag Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fag Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: "Hoje" é a casa (fé, rotina, demandas, dinheiro, IA). Sidebar no desktop, barra inferior no celular. */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#ECEEF7; --line:#DFE2EF;
  --fg:#111428; --muted:#5D6280; --accent:#4A4BE0; --accent-fg:#FFFFFF; --accent-soft:#E7E7FD;
  --in:#0B8457; --in-soft:#DFF3EA; --out:#CC2F3B; --out-soft:#FBE5E7; --warn:#A5680F; --warn-soft:#FBF0DB;
  --gold:#C08A2B;
  --shadow:0 1px 2px rgba(17,20,40,.05),0 10px 30px rgba(17,20,40,.07);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0B16; --surface:#12142A; --surface-2:#1A1D38; --line:#262A4C;
  --fg:#ECEDF8; --muted:#9095B6; --accent:#8B8CFF; --accent-fg:#0A0B16; --accent-soft:#22245A;
  --in:#3DCB8E; --in-soft:#0F2A22; --out:#FF6E78; --out-soft:#331820; --warn:#F2B451; --warn-soft:#2E2412; --gold:#E6B45A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B16; --surface:#12142A; --surface-2:#1A1D38; --line:#262A4C;
  --fg:#ECEDF8; --muted:#9095B6; --accent:#8B8CFF; --accent-fg:#0A0B16; --accent-soft:#22245A;
  --in:#3DCB8E; --in-soft:#0F2A22; --out:#FF6E78; --out-soft:#331820; --warn:#F2B451; --warn-soft:#2E2412; --gold:#E6B45A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.pos{color:var(--in)} .neg{color:var(--out)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* estrutura */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.02em}
.logo{width:28px;height:28px;border-radius:8px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23F59E6C%22/%3E%3Cstop offset=%22.42%22 stop-color=%22%237457E6%22/%3E%3Cstop offset=%221%22 stop-color=%22%232B6FE0%22/%3E%3C/linearGradient%3E%3CradialGradient id=%22s%22 cx=%22.5%22 cy=%22.5%22 r=%22.5%22%3E%3Cstop offset=%220%22 stop-color=%22%23FFF6D6%22/%3E%3Cstop offset=%221%22 stop-color=%22%23FFD27A%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M21 49V27.5C21 21.7 25.2 17 31 17h13%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%226.5%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M21 33.5h11%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%226.5%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2244.5%22 cy=%2236.5%22 r=%227.2%22 fill=%22url(%23s)%22/%3E%3Ccircle cx=%2244.5%22 cy=%2236.5%22 r=%224.4%22 fill=%22none%22 stroke=%22%23D99A3A%22 stroke-width=%221.4%22/%3E%3C/svg%3E") center/cover no-repeat;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:13px;font-weight:700;flex:none}

.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--out);border-color:var(--out-soft);background:var(--out-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;font-weight:600}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.out{background:var(--out-soft);color:var(--out)} .chip.in{background:var(--in-soft);color:var(--in)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

/* ===== HOJE ===== */
.aurora{position:relative;border-radius:22px;padding:22px 18px 18px;color:#fff;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:18px}
.aurora::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--sky)}
.aurora::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-60px;top:-90px;z-index:-1;background:radial-gradient(circle,var(--sun) 0%,transparent 68%);opacity:.9;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12) translate(-10px,8px)}}
.aurora.manha{--sky:linear-gradient(160deg,#F7A774 0%,#E77A8C 38%,#7A6FD8 100%);--sun:#FFE3A3}
.aurora.tarde{--sky:linear-gradient(160deg,#4AA8F0 0%,#4A6BE0 50%,#5A43C9 100%);--sun:#FFF4C9}
.aurora.noite{--sky:linear-gradient(160deg,#1D2259 0%,#2B1F5C 55%,#0F1433 100%);--sun:#9DA8FF}
.aurora .hello{font-family:var(--f-display);font-size:clamp(24px,6.5vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.aurora .date{font-size:13.5px;opacity:.85;margin-top:4px}
.aurora .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.aurora .pill{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:500;color:#fff;text-decoration:none}
.verse{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.verse q{display:block;font-family:var(--f-serif);font-style:italic;font-size:clamp(21px,5.2vw,27px);line-height:1.25;quotes:"“" "”"}
.verse .ref{margin-top:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.85}
.verse .pray{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:14.5px;line-height:1.55}
.verse .pray b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.verse .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.vbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600}
.vbtn:hover{background:rgba(255,255,255,.22)}
.aiask{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:14px;padding:6px 6px 6px 14px;color:#111428}
.aiask input{flex:1;border:0;background:transparent;font-size:15px;min-width:0;color:#111428;padding:6px 0}
.aiask input::placeholder{color:#6A6F90}
.aiask input:focus{outline:none}
.aiask button{border:0;width:38px;height:38px;border-radius:10px;background:#4A4BE0;color:#fff;display:grid;place-items:center;flex:none}

/* rotina */
.ring-row{display:flex;align-items:center;gap:14px}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.habits{display:flex;flex-wrap:wrap;gap:8px}
.habit{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 8px;font-size:14px;font-weight:500;text-align:left;transition:background .2s,border-color .2s}
.habit .dot{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.habit .dot svg{opacity:0}
.habit.on{background:var(--in-soft);border-color:transparent;color:var(--in)}
.habit.on .dot{background:var(--in);border-color:var(--in);color:#fff;animation:pop .35s}
.habit.on .dot svg{opacity:1}
.habit small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.habit .streak{font-size:11px;font-weight:700;color:var(--gold)}
@keyframes pop{40%{transform:scale(1.25)}}

/* demandas */
.qadd{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:5px 5px 5px 12px}
.qadd input{flex:1;border:0;background:transparent;font-size:15px;min-width:0;padding:6px 0}
.qadd input:focus{outline:none}
.qopts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qopts button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.qopts button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{font-weight:500;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;align-items:center}
.prio{width:8px;height:8px;border-radius:50%;display:inline-block}
.prio.alta{background:var(--out)} .prio.media{background:var(--warn)} .prio.baixa{background:var(--muted)}
.tbtn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px}
.tbtn:hover{background:var(--surface-2)}

/* dinheiro */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:grid;gap:16px}
.hero .big{font-family:var(--f-mono);font-size:clamp(30px,8vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .sub{font-size:13.5px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:10px 12px;min-width:0}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(12px,3.5vw,15px);margin-top:2px;white-space:nowrap;letter-spacing:-.03em}
.alert{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--out-soft);color:var(--out);font-weight:500;font-size:14px;border:0;text-align:left;width:100%}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--in-soft);color:var(--in)}
.alert b{font-family:var(--f-mono)}
.alert .go{margin-left:auto;font-weight:600;white-space:nowrap}
.dre-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dre-row:last-child{border-bottom:0}
.dre-row.total{font-weight:600;border-top:1px solid var(--fg);border-bottom:0;margin-top:2px;padding-top:11px}
.dre-row .r{text-align:right}
.dre-row small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.bar-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.item .val small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.clickable{cursor:pointer}
.item.clickable:hover{background:var(--surface-2)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;flex:none;transition:all .2s}
.check svg{opacity:0}
.check.on{background:var(--in);border-color:var(--in);color:#fff;animation:pop .35s}
.check.on svg{opacity:1}
.check.late{border-color:var(--out)}
.day-h{font-size:12px;font-weight:600;color:var(--muted);padding:14px 4px 4px;text-transform:capitalize}
.monthbar{display:flex;align-items:center;gap:6px}
.monthbar .lbl{font-family:var(--f-display);font-weight:600;min-width:120px;text-align:center;text-transform:capitalize}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sumline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumline .stat{border:1px solid var(--line);border-radius:12px}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:15.5px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px}
.kv b{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--fg)}
.kv span{color:var(--muted)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--in);border-radius:99px;transition:width .6s}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.chart svg{display:block;width:100%;height:auto}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body);text-transform:capitalize}
.empty{text-align:center;padding:26px 16px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{color:var(--fg);font-size:17px}
.empty p{margin:0;max-width:46ch}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.banner .btn{margin-left:auto}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{padding:7px 14px;border-radius:99px;font-size:13.5px;color:var(--muted);text-decoration:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
.subtabs a[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ===== IA ===== */
.chat{display:flex;flex-direction:column;gap:12px;min-height:42vh}
.msg{max-width:min(620px,88%);padding:11px 14px;border-radius:16px;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai p{margin:0 0 8px} .msg.ai p:last-child{margin:0}
.msg.ai ul{margin:4px 0 8px;padding-left:18px}
.msg .tool{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;padding:9px 8px;font-size:16px;max-height:140px;min-width:0}
.composer textarea:focus{outline:none}
.composer .iconbtn{border:0;width:40px;height:40px}
.composer .send{background:var(--accent);color:var(--accent-fg)}
.mic.on{background:var(--out);color:#fff}

const API='https://dmycgqdkhebukghbydri.supabase.co/functions/v1/fagmoney';
let TOKEN='';try{TOKEN=localStorage.getItem('fm.token')||''}catch(e){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
async function api(path,opt={}){
  const r=await fetch(path,Object.assign({},opt,{headers:Object.assign({'content-type':'application/json'},opt.headers||{},{authorization:'Bearer '+TOKEN})}));
  if(r.status===401){sair();const e=new Error('auth');e.auth=true;throw e}
  return r;
}
function sair(){TOKEN='';try{localStorage.removeItem('fm.token')}catch(e){}S.ready=false;mostrarLogin()}
function strip(o){const r={};for(const k in o)if(k!=='id'&&o[k]!==undefined)r[k]=o[k];return r}
let rq=0;function soon(){clearTimeout(rq);rq=setTimeout(()=>{if(!(S.view==='fag'&&S.aiBusy))render()},30)}
async function put(col,obj){
  const i=S[col].findIndex(x=>x.id===obj.id);
  if(i>=0)S[col][i]=obj;else S[col].push(obj);
  soon();
  try{const r=await api(API+'/doc/'+col+'/'+encodeURIComponent(obj.id),{method:'PUT',body:JSON.stringify(strip(obj))});if(!r.ok)throw new Error('put')}
  catch(e){if(!e.auth)toast('Não salvou. Confira a internet e tente de novo.')}
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);soon();
  try{const r=await api(API+'/doc/'+col+'/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)throw new Error('del')}
  catch(e){if(!e.auth)toast('Não apagou. Tente de novo.')}
}
async function putMany(col,arr){for(const o of arr)await put(col,o)}

/* ================= finanças: cálculos ================= */
const inCart=x=>S.cart==='tudo'||(x.carteira||'pessoal')===S.cart;
const L=()=>S.lanc.filter(inCart);
const sign=l=>l.tipo==='receita'?1:-1;
const saldoConta=c=>(+c.saldoInicial||0)+sum(S.lanc.filter(l=>l.pago&&l.contaId===c.id),l=>sign(l)*l.valor);
function caixa(all){
  const f=all?()=>true:inCart;const ids=new Set(S.contas.map(c=>c.id));
  return sum(S.contas.filter(f),saldoConta)+sum(S.lanc.filter(f).filter(l=>l.pago&&!ids.has(l.contaId)),l=>sign(l)*l.valor);
}
const pend=()=>L().filter(l=>!l.pago);
function ate(dias){const lim=addDays(TODAY,dias);const p=pend().filter(l=>l.data<=lim);return{rec:sum(p.filter(l=>l.tipo==='receita'),l=>l.valor),pag:sum(p.filter(l=>l.tipo==='despesa'),l=>l.valor)}}
const atrasadas=()=>pend().filter(l=>l.data<TODAY&&l.tipo==='despesa');
const atrasRec=()=>pend().filter(l=>l.data<TODAY&&l.tipo==='receita');
const dividas=()=>S.dividas.filter(inCart);
const metas=()=>S.metas.filter(inCart);
const FIN=['lanc','contas','dividas','metas'];
const temExemplo=()=>COLS.some(c=>S[c].some(x=>x.exemplo));
const vazioFin=()=>FIN.every(c=>S[c].length===0);
function projecao(H){
  const start=caixa();const cur=mk(TODAY);const rows=[];let saldo=start;const series={};
  L().forEach(l=>{if(l.recorrente==='mensal'&&l.serie){const s=series[l.serie];if(!s||l.data>s.data)series[l.serie]=l}});
  for(let i=0;i<H;i++){
    const k=mkAdd(cur,i);let ent=0,sai=0;
    pend().forEach(l=>{const lk=mk(l.data);if(lk===k||(i===0&&lk<cur)){if(l.tipo==='receita')ent+=l.valor;else sai+=l.valor}});
    Object.values(series).forEach(l=>{if(mk(l.data)<k){if(l.tipo==='receita')ent+=l.valor;else sai+=l.valor}});
    dividas().forEach(d=>{const par=+d.parcela||0;if(par<=0||(+d.saldo||0)<=0)return;const st=d.ultimoPag===cur?1:0;const n=Math.ceil(d.saldo/par);const j=i-st;if(j>=0&&j<n)sai+=Math.min(par,d.saldo-par*j)});
    saldo+=ent-sai;rows.push({k,ent,sai,res:ent-sai,saldo});
  }
  return{start,rows};
}

const wd=s=>parseD(s).getDay();
const habHoje=(date=TODAY)=>S.habitos.filter(h=>!h.dias||!h.dias.length||h.dias.includes(wd(date))).sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99'));
const feitos=date=>(S.checks.find(c=>c.id===date)||{}).feitos||{};
function streak(h){let n=0,d=TODAY;if(!feitos(d)[h.id])d=addDays(d,-1);for(let i=0;i<400;i++){const sched=!h.dias||!h.dias.length||h.dias.includes(wd(d));if(sched){if(feitos(d)[h.id])n++;else break}d=addDays(d,-1)}return n}
function toggleHab(id,date=TODAY){

/* ===== Jonas pela API da Anthropic (função /api/jonas) ===== */
async function jonasStream(body,{onText,signal}={}){
  const r=await fetch(API+'/jonas',{method:'POST',signal,headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify(body)});
  if(r.status===401){sair();throw {msg:'Entre de novo com a sua senha.'}}
  if(!r.ok||!r.body){let m='Não consegui falar com o Jonas agora.';try{m=(await r.json()).erro||m}catch(e){}throw {msg:m}}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',fim=null;
  for(;;){
    const {value,done}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){

/* Roda a conversa com ferramentas. hist recebe as mensagens novas (append-only). */
async function conversar(hist,{modo='chat',onText,onTool,signal}={}){
  const ts=tools();const defs=ts.map(t=>({name:t.name,description:t.description,input_schema:t.input_schema}));
  let texto='';
  for(let volta=0;volta<8;volta++){
    const fim=await jonasStream({modo,system:instrucoes(modo),messages:hist,tools:defs},{signal,onText:d=>{texto+=d;if(onText)onText(texto)}});
    hist.push({role:'assistant',content:fim.content});
    if(fim.stop_reason==='refusal'&&!texto.trim())return 'Isso eu não consigo responder. Me pergunta de outro jeito?';
    if(fim.stop_reason!=='tool_use')return texto;
    const res=[];
    for(const b of fim.content){
      if(b.type!=='tool_use')continue;
      const t=ts.find(x=>x.name===b.name);if(onTool)onTool(t?t.description.split('.')[0]:b.name);
      try{if(!t)throw new Error('ferramenta desconhecida');const out=await t.run(b.input||{});res.push({type:'tool_result',tool_use_id:b.id,content:JSON.stringify(out===undefined?{ok:true}:out).slice(0,30000)})}
      catch(e){res.push({type:'tool_result',tool_use_id:b.id,content:'Erro: '+((e&&e.message)||e),is_error:true})}
    }
    hist.push({role:'user',content:res});
    if(texto&&!/\s$/.test(texto)){texto+='\n\n';if(onText)onText(texto)}
  }
  return texto;
}

}

  openSheet(novo?'Novo lançamento':'Editar lançamento',body,f=>{

    const data=f.querySelector('#f-data').value;if(!data)return 'Informe a data de vencimento.';

      for(let i=0;i<n;i++)arr.push(Object.assign({},base,{id:uid(),data:addMonths(data,i),parcela:(i+1)+'/'+n,serie,pago:i===0?base.pago:false,pagoEm:i===0&&base.pago?TODAY:null}));
      putMany('lanc',arr);toast(n+' parcelas lançadas');return}
    const obj=Object.assign({},base,{id:uid(),recorrente:rep==='mensal'?'mensal':'nao',pagoEm:base.pago?TODAY:null});if(rep==='mensal')obj.serie=uid();
    put('lanc',obj);if(obj.pago)gerarProximo(obj);toast('Lançamento salvo');
  },{onDelete:novo?null:()=>{del('lanc',l.id);toast('Lançamento apagado')},after:f=>{
    const dl=f.querySelector('#cats');const fill=()=>{const t=segVal(f,'tipo');dl.innerHTML=CAT[t].map(c=>`<option value="${c}">`).join('');f.querySelector('#pagoLbl').textContent=t==='receita'?'Já foi recebido':'Já foi pago'};fill();

    const rep=f.querySelector('#f-rep');if(rep)rep.addEventListener('change',()=>{f.querySelector('#parcBox').hidden=rep.value!=='parcelado';const h=f.querySelector('#repHint');h.hidden=rep.value==='nao';h.textContent=rep.value==='mensal'?'Entra na projeção todo mês. Quando você marcar como pago, o próximo mês é criado.':'O valor acima é o de cada parcela. Uma parcela por mês a partir do vencimento.'});
  }});
}

let tmr;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>el.hidden=true,2400)}
function prazoDe(k){return k==='hoje'?TODAY:k==='amanha'?addDays(TODAY,1):k==='semana'?addDays(TODAY,(5-new Date().getDay()+7)%7||0):''}
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='qadd'){const i=f.querySelector('input');const t=i.value.trim();if(!t)return;put('demandas',{id:uid(),titulo:t,prazo:prazoDe(S.dPrazo),prioridade:'media',area:'',feito:false,criadoEm:TODAY});i.value='';toast('Demanda adicionada');render();setTimeout(()=>{const n=document.getElementById('qadd-in');if(n)n.focus()},0)}
  if(k==='aiask'){const i=f.querySelector('input');enviar(i.value);}
  if(k==='chat'){const t=f.querySelector('textarea');const v=t.value;t.value='';if(micOn&&recChat){skipAuto=true;try{recChat.stop()}catch(_){}}falarStop();enviar(v)}
  if(k==='login'){const btn=f.querySelector('button[type=submit]');const err=f.querySelector('#loginErr');btn.disabled=true;fetch(API+'/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({senha:f.querySelector('#senha').value})}).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok||!j.token)throw new Error(j.erro||'Não entrou.');TOKEN=j.token;try{localStorage.setItem('fm.token',TOKEN)}catch(_){}init()}).catch(e=>{err.textContent=e.message||'Sem conexão.';err.hidden=false;btn.disabled=false})}
});
document.addEventListener('click',e=>{
  const t=e.target;
  if($modal.contains(t)){if(t.closest('button[data-close]')||t.dataset.scrim)closeSheet();return}
  let el;
  if(el=t.closest('[data-pay]')){e.stopPropagation();togglePago(el.dataset.pay);return}
  if(el=t.closest('[data-hab]')){toggleHab(el.dataset.hab,el.dataset.date||TODAY);return}
  if(el=t.closest('[data-dem]')){toggleDem(el.dataset.dem);return}
  if(el=t.closest('[data-edit-dem]')){formDem(S.demandas.find(x=>x.id===el.dataset.editDem));return}
  if(el=t.closest('[data-edit-hab]')){formHab(S.habitos.find(x=>x.id===el.dataset.editHab));return}
  if(el=t.closest('[data-edit]')){formLanc(S.lanc.find(x=>x.id===el.dataset.edit));return}
  if(el=t.closest('[data-cart]')){S.cart=el.dataset.cart;try{localStorage.setItem('fm.cart',S.cart)}catch(_){}render();return}
  if(el=t.closest('[data-mes]')){S.mes=mkAdd(S.mes,+el.dataset.mes);render();return}
  if(el=t.closest('[data-filtro]')){S.filtro=el.dataset.filtro;render();return}
  if(el=t.closest('[data-dfiltro]')){S.dFiltro=el.dataset.dfiltro;render();return}
  if(el=t.closest('[data-dprazo]')){S.dPrazo=el.dataset.dprazo;document.querySelectorAll('[data-dprazo]').forEach(b=>b.setAttribute('aria-pressed',b===el));return}
  if(el=t.closest('[data-hor]')){S.horizonte=+el.dataset.hor;render();return}
  if(el=t.closest('[data-go]')){location.hash=el.dataset.go;return}
  if(el=t.closest('[data-sug]')){enviar(el.dataset.sug);return}
  if(el=t.closest('[data-edit-conta]')){formConta(S.contas.find(x=>x.id===el.dataset.editConta));return}
  if(el=t.closest('[data-edit-div]')){formDivida(S.dividas.find(x=>x.id===el.dataset.editDiv));return}
  if(el=t.closest('[data-pagar-div]')){formPagarDiv(S.dividas.find(x=>x.id===el.dataset.pagarDiv));return}
  if(el=t.closest('[data-edit-meta]')){formMeta(S.metas.find(x=>x.id===el.dataset.editMeta));return}
  if(el=t.closest('[data-aporte]')){formAporte(S.metas.find(x=>x.id===el.dataset.aporte));return}
  if(el=t.closest('[data-act]')){const a=el.dataset.act;if(!S.ready&&a!=='quick'&&a!=='ligar')return;
    if(a==='quick'){if(S.ready)quickSheet()}
    else if(a==='novo')formLanc(null);else if(a==='nova-conta')formConta(null);else if(a==='nova-divida')formDivida(null);else if(a==='nova-meta')formMeta(null);
    else if(a==='nova-dem')formDem(null);else if(a==='novo-hab')formHab(null);else if(a==='rotina-sug')rotinaSugestao();
    else if(a==='exemplo')carregarExemplo();else if(a==='limpar-ex')limparExemplo();
    else if(a==='orar'){S.showPray=!S.showPray;render()}
    else if(a==='outro-v'){S.vOff++;render()}
    else if(a==='orar-ia'){if(!S.showPray){S.showPray=true;render()}orarIA()}
    else if(a==='copiar-v'){const v=VERSOS[(doy()+S.vOff)%VERSOS.length];const txt=`"${v[1]}" (${v[0]})`;try{navigator.clipboard.writeText(txt).then(()=>toast('Versículo copiado'),()=>toast(txt))}catch(_){toast(txt)}}
    else if(a==='treinar')formTreinar();
    else if(a==='voz'){S.voz=!S.voz;try{localStorage.setItem('fm.voz',S.voz?'1':'0')}catch(_){}if(S.voz)falar('Voz ligada. Pode falar comigo, Daniel.');else falarStop();render()}
    else if(a==='ligar')abrirLigacao();
    else if(a==='limpar-chat'){SESS=null;CHAT=[];put('config',{id:'chat',msgs:[]});render()}
    else if(a==='stop'){if(ctl)ctl.abort()}
    else if(a==='mic')mic(el);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$modal.innerHTML)closeSheet()});
init();
})();
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
